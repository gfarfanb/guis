[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mupen64plus-gui"
version = "0.1.0"
description = "PySide6 launch-options GUI for the Mupen64Plus wrapper script"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "guis" }]
keywords = ["mupen64plus", "n64", "emulator", "gui", "pyside6"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
build = ["PyInstaller>=6.0"]

[project.gui-scripts]
mupen64plus-gui = "gui:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["gui", "config", "profile"]
